<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kara Nawzad | Telecommunications Engineering Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .brand-badge {
      background: #0284c7;
      color: #ffffff;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Project Tabs */
    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid #374151;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #1f2937;
      color: #ffffff;
      border-color: #4b5563;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
    }

    /* External Links (GitHub / LinkedIn) */
    .external-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ext-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      background: #1f2937;
      border: 1px solid #374151;
      transition: all 0.2s ease;
    }

    .ext-btn:hover {
      background: #374151;
      color: #ffffff;
    }

    /* Workspace hosting the active project */
    #workspace {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-title">KARA NAWZAD</div>
      <span class="brand-badge">Telecom Engineer</span>
    </div>

    <!-- Navigation Tabs for the 4 Projects -->
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchApp('kurdline', this)">
        📡 KurdLine (Map)
      </button>
      <button class="tab-btn" onclick="switchApp('autonoc', this)">
        🤖 AutoNOC (AI)
      </button>
      <button class="tab-btn" onclick="switchApp('antenna', this)">
        📶 Antenna Synthesis
      </button>
      <button class="tab-btn" onclick="switchApp('fiberlab', this)">
        💡 FiberLAB (FTTH)
      </button>
    </nav>

    <!-- External Links -->
    <div class="external-links">
      <a href="https://github.com/kara-nawzad" target="_blank" class="ext-btn">GitHub</a>
      <a href="https://linkedin.com" target="_blank" class="ext-btn">LinkedIn</a>
    </div>
  </header>

  <!-- Workspace Container Hosting the 4 Projects -->
  <div id="workspace">
    <!-- Replace these placeholder URLs with your real links when ready -->
    <iframe id="kurdline" class="active" src="https://example.com"></iframe>
    <iframe id="autonoc" src="https://example.com"></iframe>
    <iframe id="antenna" src="https://example.com"></iframe>
    <iframe id="fiberlab" src="https://example.com"></iframe>
  </div>

  <script>
    function switchApp(appId, btnElement) {
      // 1. Hide all iframes
      document.querySelectorAll('iframe').forEach(frame => {
        frame.classList.remove('active');
      });

      // 2. Deactivate all buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // 3. Show selected iframe and activate its button
      document.getElementById(appId).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
