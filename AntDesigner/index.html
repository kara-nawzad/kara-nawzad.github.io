<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntDesigner · Kara Nawzad</title>
  <meta name="description" content="AntDesigner: AI-based microstrip antenna synthesis using CST-anchored neural surrogates, a graduation project by Kara Nawzad.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F5F2EA; }
    body { display: flex; flex-direction: column; }
    /* Slim back bar, coloured to match the AntDesigner app header so it doesn't cover the app's own logo */
    .back-bar { flex: 0 0 auto; height: 44px; display: flex; align-items: center; padding: 0 16px; background: #F5F2EA; border-bottom: 1px solid rgba(20,33,61,.14); font: 500 13px/1 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .back-bar a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; color: #5B6478; text-decoration: none; }
    .back-bar a:hover { color: #14213D; }
    .back-bar a:focus-visible { outline: 2px solid #14213D; outline-offset: -6px; border-radius: 6px; }
    .frame { position: relative; flex: 1 1 auto; min-height: 0; }
    /* Shown behind the iframe while the app wakes up (fly.dev apps can take a few seconds on first visit). */
    .loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #5B6478; font: 500 14px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .loading strong { display: block; color: #14213D; font-size: 18px; margin-bottom: 4px; }
    .loading a { color: #14213D; }
    iframe { position: relative; width: 100%; height: 100%; border: none; display: block; background: transparent; }
  </style>
</head>
<body>
  <nav class="back-bar" aria-label="Portfolio"><a href="https://karanawzad.tech/#work">← Back to portfolio</a></nav>
  <div class="frame">
    <div class="loading"><div><strong>Starting AntDesigner…</strong>The app may take a few seconds to wake up.<br><a href="https://antenna-ai-project.fly.dev/" target="_blank" rel="noopener noreferrer">Open it directly ↗</a></div></div>
    <iframe src="https://antenna-ai-project.fly.dev/" title="AntDesigner" allowfullscreen></iframe>
  </div>
</body>
</html>
